name: Bridge tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
            pi: locked
          - node: 26
            pi: 0.85.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && git diff --exit-code -- bundle/index.js
      - if: matrix.pi != 'locked'
        run: npm install --no-save --package-lock=false @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-agent-core@${{ matrix.pi }} @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - if: matrix.pi == 'locked'
        run: npm run typecheck
      - if: matrix.pi != 'locked'
        run: npx tsc --noEmit --project tests/tsconfig.pi85.json
      - run: npm run test:unit
